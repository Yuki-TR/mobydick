version: 1
project:
  id: moby_dick_pilot
  title: "Moby-Dick — The Sea Calls"
  language: en-US

output:
  width: 1024
  height: 576
  fps: 24

speakers:
  ishmael:
    voice: en-US-GuyNeural
    rate: "-5%"
    volume: "+0%"
    pitch: "-2Hz"

scenes:
  - id: drizzly_manhattan
    title: A Drizzly November in the Soul
    image: assets/01_drizzly_manhattan.png
    motion_prompt: >-
      Rear three-quarter view of Ishmael in a wet 1840s lower Manhattan street.
      Fine rain drifts through cold dawn light. He pauses, breathes, then slowly
      turns his gaze down the cobbled slope toward the harbor. His charcoal
      greatcoat shifts in the wind; distant masts sway subtly in sea mist. Slow
      restrained dolly forward, photorealistic historical drama, natural human
      motion, stable face, authentic fabric, subtle 35mm grain, no text.
    lines:
      - id: line_001
        speaker: ishmael
        text: >-
          Call me Ishmael. Some years ago—never mind how long precisely—having
          little or no money in my purse, and nothing particular to interest me
          on shore, I thought I would sail about a little and see the watery
          part of the world.
        pause_after_ms: 500

  - id: water_gazers
    title: The Magnetic Pull of Water
    image: assets/02_water_gazers.png
    motion_prompt: >-
      On an 1840s Manhattan timber pier, Ishmael and a crowd of landsmen stand
      silently at the extreme edge of the city, fixed on the open harbor. Coats
      and hat brims stir in the salt breeze, rigging moves gently, distant ships
      cross the silver haze. Ishmael turns from camera toward the horizon as if
      answering a magnetic summons. Very slow lateral camera drift,
      photorealistic period realism, stable identities, no text.
    lines:
      - id: line_002
        speaker: ishmael
        text: >-
          Whenever I find myself growing grim about the mouth; whenever it is a
          damp, drizzly November in my soul, then I account it high time to get
          to sea as soon as I can. I quietly take to the ship.
        pause_after_ms: 500

  - id: simple_sailor
    title: Before the Mast
    image: assets/03_simple_sailor.png
    motion_prompt: >-
      Ishmael works on the wet forecastle deck of an 1840s merchant sailing
      ship leaving New York harbor. He braces against the wind, grips a coarse
      hemp line and pulls with the other sailors while the receding city glows
      beneath broken dawn clouds. Canvas fills gradually overhead and sea spray
      crosses the rail. Subtle handheld push, grounded physical motion,
      photorealistic historical film, stable anatomy, no text.
    lines:
      - id: line_003
        speaker: ishmael
        text: >-
          When I go to sea, I go as a simple sailor, right before the mast.
          They order me about and make me jump from spar to spar. But they make
          a point of paying me for my trouble.
        pause_after_ms: 600

  - id: hooded_phantom
    title: The Great Whale
    image: assets/04_hooded_phantom.png
    motion_prompt: >-
      From behind Ishmael on the bow at night, the ship rises and falls gently
      on a black-blue sea. Moonlit fog parts far ahead and the immense pale back
      of a white sperm whale surfaces like a snow hill, exhales a low veil of
      mist, and begins to sink without attacking. Ishmael remains small and
      transfixed. Slow ominous dolly toward the horizon, physically believable
      whale and water, restrained awe, photorealistic 35mm historical drama,
      no text or fantasy glow.
    lines:
      - id: line_004
        speaker: ishmael
        text: >-
          Chief among these motives was the great whale himself: the wild and
          distant seas where he rolled his island bulk, and the nameless perils
          of the whale. Into my soul floated one grand hooded phantom, like a
          snow hill in the air.
        pause_after_ms: 0
