- id: call_me_ishmael
  title: Call Me Ishmael
  image: assets/keyframes/001_street.png
  end_image: assets/keyframes/002_coffin.png
  motion_prompt: Rear three-quarter view of Ishmael walking alone down a wet 1840s
    lower Manhattan street toward the harbor, fine November rain, restrained slow
    dolly forward, natural coat movement, stable face, mouth closed, no visible speech,
    photorealistic historical drama, no text.
  duration_ms: 14000
  ambience:
    file: assets/ambience/rainy_city.wav
    description: Fine rain, distant carriage wheels, and a faint harbor wind.
    gain_db: -26.0
  lines:
  - id: call_me_ishmael_modern
    speaker: ishmael
    text: Call me Ishmael. Years ago, with little money and nothing keeping me on
      shore, I decided to sail and see the watery part of the world.
    pause_after_ms: 250
- id: november_in_the_soul
  title: November in the Soul
  image: assets/keyframes/002_coffin.png
  end_image: assets/keyframes/003_harbor_choice.png
  motion_prompt: Close profile of Ishmael paused beneath dripping eaves as a funeral
    cart passes in soft focus, cold gray dawn, subtle breath and rain motion, inward
    melancholy, mouth closed, no visible speech, stable anatomy, photorealistic 35mm
    period film, no text.
  duration_ms: 14000
  ambience:
    file: assets/ambience/rainy_city.wav
    description: Fine rain, distant carriage wheels, and a faint harbor wind.
    gain_db: -26.0
  lines:
  - id: november_in_the_soul_modern
    speaker: ishmael
    text: Whenever my expression turns grim, whenever my soul feels like a wet November,
      and my thoughts drift toward death, I know the darkness is returning.
    pause_after_ms: 300
- id: substitute_for_pistol
  title: The Quiet Remedy
  image: assets/keyframes/003_harbor_choice.png
  end_image: assets/keyframes/004_manhattan.png
  motion_prompt: Ishmael reaches the end of the street and the harbor opens before
    him; his posture steadies as rigging appears through rain, gentle camera arc from
    city to sea, mouth closed, no visible speech, historically accurate 1840s clothing,
    restrained realism, no text.
  duration_ms: 14000
  ambience:
    file: assets/ambience/rainy_city.wav
    description: Fine rain, distant carriage wheels, and a faint harbor wind.
    gain_db: -26.0
  lines:
  - id: substitute_for_pistol_modern
    speaker: ishmael
    text: Then I know it is time to get to sea. Sailing is the remedy that keeps me
      alive. I do not make a spectacle of it; I quietly join a ship.
    pause_after_ms: 250
- id: insular_city
  title: The Island City
